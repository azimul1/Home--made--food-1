<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login / Register</title>
<link rel="stylesheet" href="login.css">

<style>
.hidden {
  display: none;
}
</style>

</head>

<body>

<div class="auth-box">

  <div class="app-name">HomeMade Food</div>
  <div class="app-subtitle">Get your fresh, homemade meals delivered!</div>

  <h2 id="formTitle">User Login</h2>

  <div class="error" id="errorMsg"></div>

  <input type="email" id="email" placeholder="Email">
  <input type="tel" id="phone" placeholder="Phone Number" class="hidden">
  <input type="password" id="password" placeholder="Password">
  <input type="text" id="name" placeholder="Full Name" class="hidden">

  <div class="btn-group">
    <button class="primary-btn" id="mainBtn">Login</button>
    <button class="secondary-btn" id="resetBtn">Clear</button>
  </div>

  <div class="auth-footer">
    <span id="toggleText">Don't have an account?</span>
    <a id="toggleLink">Register</a>
  </div>

</div>

<script>
let isLogin = true;

const formTitle = document.getElementById("formTitle");
const mainBtn = document.getElementById("mainBtn");
const toggleLink = document.getElementById("toggleLink");
const toggleText = document.getElementById("toggleText");
const errorMsg = document.getElementById("errorMsg");

const email = document.getElementById("email");
const name = document.getElementById("name");
const phone = document.getElementById("phone");
const password = document.getElementById("password");
const resetBtn = document.getElementById("resetBtn");

// Toggle Login/Register
toggleLink.addEventListener("click", () => {
  isLogin = !isLogin;

  formTitle.innerText = isLogin ? "User Login" : "User Registration";
  mainBtn.innerText = isLogin ? "Login" : "Register";
  toggleText.innerText = isLogin ? "Don't have an account?" : "Already have an account?";
  toggleLink.innerText = isLogin ? "Register" : "Login";
  name.classList.toggle("hidden", isLogin);
  phone.classList.toggle("hidden", isLogin);
  errorMsg.innerText = "";
});

// Submit
mainBtn.addEventListener("click", async () => {
  errorMsg.innerText = "";

  if (!email.value || !password.value || (!isLogin && !phone.value)) {
    errorMsg.innerText = "⚠ Please fill all fields";
    return;
  }

  if (password.value.length < 6) {
    errorMsg.innerText = "⚠ Password must be at least 6 characters";
    return;
  }

  mainBtn.innerText = "Processing...";
  mainBtn.disabled = true;

  try {
    const response = await fetch(isLogin ? "login.php" : "register.php", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        name: name.value,
        email: email.value,
        phone: phone.value,
        password: password.value
      })
    });

    const data = await response.text();

    if (data === "success") {
      alert(isLogin ? "Login Successful" : "Registration Successful");

      // redirect after login
      if (isLogin) {
        window.location.href = "dashboard.php";
      } else {
        toggleLink.click(); // switch to login
      }

    } else {
      errorMsg.innerText = data;
    }

  } catch (error) {
    errorMsg.innerText = "Server error. Try again.";
  }

  mainBtn.innerText = isLogin ? "Login" : "Register";
  mainBtn.disabled = false;
});

// Reset
resetBtn.addEventListener("click", () => {
  name.value = "";
  email.value = "";
  phone.value = "";
  password.value = "";
  errorMsg.innerText = "";
});
</script>

</body>
</html>
